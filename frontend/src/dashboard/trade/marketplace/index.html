<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Marché - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />
        <!-- Config -->
        <script src="/config.js"></script>
        <!-- Components -->
        <script type="module" src="/components/tf-app-bar.js"></script>
        <script type="module" src="/components/tf-bottom-actions.js"></script>
        <script type="module" src="/components/tf-layout.js"></script>
        <script type="module" src="/components/tf-button.js"></script>
        <!-- Theme -->
        <link rel="stylesheet" href="/utils/theme.css" />
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <!-- Custom page style and script -->
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="script.js"></script>
    </head>

    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>
            <main class="container">
                <div class="sub-header">
                    <tf-button
                        icon="keyboard_backspace"
                        variant="secondary"
                        onclick="window.history.back()"
                    >
                        Retour
                    </tf-button>
                    <div class="market-stats">
                        <span class="purchase-info"
                            ><span class="material-symbols-rounded"
                                >shopping_cart</span
                            >
                            Achats restants : 10</span
                        >
                        <span class="stock-info"
                            ><span class="material-symbols-rounded">store</span>
                            En stock :
                        </span>

                        <tf-button
                            icon="sell"
                            variant="secondary"
                            onclick="
                                window.location.href =
                                    '/dashboard/management/assets'
                            "
                        >
                            Vendre
                        </tf-button>
                    </div>
                </div>

                <h1 class="page-title">Marché</h1>

                <div class="game-grid">
                    <aside class="left-panel">
                        <div class="cart-card">
                            <div class="cart-total-box">
                                <div class="cart-icon-title">
                                    <span class="material-symbols-rounded">
                                        shopping_cart
                                    </span>
                                    Total
                                </div>
                                <div class="cart-actions">
                                    <span
                                        class="total-price"
                                        id="totalPrice"
                                    ></span>
                                    <tf-button
                                        id="pay-btn"
                                        icon="payment"
                                        variant="primary"
                                    >
                                        Payer
                                    </tf-button>
                                </div>
                            </div>

                            <div class="cart-list"></div>
                        </div>
                    </aside>

                    <section class="right-panel" id="shop-container"></section>
                </div>
            </main>
            <tf-bottom-actions
                size="small"
                variant="coop-only"
            ></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
