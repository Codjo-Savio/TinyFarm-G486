<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Clapier - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />

        <script src="/config.js"></script>
        <!-- Components -->
        <script type="module" src="/components/tf-app-bar.js"></script>
        <script type="module" src="/components/tf-bottom-actions.js"></script>
        <script type="module" src="/components/tf-layout.js"></script>
        <!-- Theme -->
        <link rel="stylesheet" href="/utils/theme.css" />
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <!-- Custom page style and script -->
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="script.js"></script>
    </head>

    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>
            <main class="container">
                <div class="taskbar">
                    <div class="taskbar-left">
                        <a
                            class="btn-back"
                            onclick="
                                window.location.href = window.location.search
                                    ? window.location.search.replace(
                                          '?from=',
                                          '',
                                      )
                                    : '/dashboard'
                            "
                        >
                            <span class="material-symbols-rounded"
                                >arrow_back</span
                            >
                            Retour
                        </a>
                    </div>

                    <div class="taskbar-right">
                        <div class="taskbar-stat">
                            <span class="material-symbols-rounded"
                                >cruelty_free</span
                            >
                            <p id="rabbit-count">0/50</p>
                            <p>Lapins</p>
                        </div>

                        <div class="taskbar-stat">
                            <span class="material-symbols-rounded">pets</span>
                            <p id="baby-rabbit-count">0/50</p>
                            <p>Lapereaux</p>
                        </div>

                        <button class="sell-button" type="button">
                            <span class="material-symbols-rounded">sell</span>
                            Vendre
                        </button>

                        <div class="actions-wrapper">
                            <button
                                id="more-actions-btn"
                                class="more-actions-button"
                                type="button"
                                onclick="toggleActionsMenu()"
                            >
                                <span class="material-symbols-rounded"
                                    >more_horiz</span
                                >
                            </button>

                            <div id="actions-menu" class="actions-menu">
                                <button
                                    id="feed-all-btn"
                                    type="button"
                                    onclick="feedAll()"
                                >
                                    Nourrir tout
                                </button>
                                <button
                                    id="water-all-btn"
                                    type="button"
                                    onclick="waterAll()"
                                >
                                    Abreuver tout
                                </button>
                                <button
                                    id="heal-all-btn"
                                    type="button"
                                    onclick="healAll()"
                                >
                                    Soigner tout
                                </button>
                                <button
                                    id="clean-all-btn"
                                    type="button"
                                    onclick="cleanAll()"
                                >
                                    Nettoyer tout
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <section>
                    <h1 class="page-title">Clapier</h1>
                    <div class="game-grid" id="game-grid"></div>
                </section>
            </main>
            <tf-bottom-actions size="small"></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
