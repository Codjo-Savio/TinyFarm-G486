<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Clapier - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />

        <!-- Police Material Symbols EN PREMIER -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />

        <!-- Config et composants APRÈS -->
        <script src="/config.js"></script>
        <script src="/components/tf-app-bar.js"></script>
        <script src="/components/tf-bottom-actions.js"></script>
        <script src="/components/tf-layout.js"></script>
        <script src="/components/tf-card.js"></script>
        <script src="/components/tf-pill.js"></script>
        <script src="/components/tf-button.js"></script>
        <script src="/components/tf-progress-bar.js"></script>

        <link rel="stylesheet" href="/styles/theme.css" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js"></script>
    </head>
    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>
            <main class="container">
                <div class="sub-header">
                    <tf-button
                        icon="keyboard_backspace"
                        variant="secondary"
                        onclick="
                            window.location.href = window.location.search
                                ? window.location.search.replace('?from=', '')
                                : '/dashboard'
                        "
                        >Retour</tf-button
                    >
                    <div class="rabbit-stats">
                        <tf-pill icon="heart_broken"
                            >Malade : <span id="sick-count">0%</span></tf-pill
                        >
                        <tf-pill icon="mop"
                            >Sale : <span id="dirty-count">0%</span></tf-pill
                        >
                        <!-- <tf-pill icon="cruelty_free"> -->
                        <span id="total-count">0</span>/100
                        <!-- </tf-pill> -->
                        <tf-button icon="sell" variant="secondary"
                            >Vendre</tf-button
                        >
                        <div class="actions-wrapper">
                            <button
                                class="menu-actions"
                                onclick="toggleActionsMenu()"
                            >
                                ...
                            </button>
                            <div class="actions-menu" id="actions-menu">
                                <button
                                    onclick="feedAll()"
                                    class="action-button"
                                    id="feed-btn"
                                >
                                    Nourrir
                                </button>
                                <button
                                    onclick="waterAll()"
                                    class="action-button"
                                    id="water-btn"
                                >
                                    Abreuver
                                </button>
                                <button
                                    onclick="healAll()"
                                    class="action-button"
                                    id="heal-btn"
                                >
                                    Soigner
                                </button>
                                <button
                                    onclick="cleanAll()"
                                    class="action-button"
                                    id="clean-btn"
                                >
                                    Nettoyer
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <h1 class="page-title">Clapier</h1>
                <div class="game-grid" id="game-grid"></div>
            </main>
            <tf-bottom-actions size="small"></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
