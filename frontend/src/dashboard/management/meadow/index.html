<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pré - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />
        <!-- Config -->
        <script src="/config.js"></script>
        <!-- Components -->
        <script src="/components/tf-app-bar.js"></script>
        <script src="/components/tf-bottom-actions.js"></script>
        <script src="/components/tf-layout.js"></script>
        <script src="/components/tf-card.js"></script>
        <script src="/components/tf-pill.js"></script>
        <script src="/components/tf-button.js"></script>
        <script src="/components/tf-progress-bar.js"></script>
        <!-- Theme -->
        <link rel="stylesheet" href="/styles/theme.css" />
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <!-- Custom page style and script -->
        <link rel="stylesheet" href="style.css" />
        <script src="script.js"></script>
    </head>

    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>
            <main class="container">
                <div class="sub-header">
                    <tf-button
                        icon="keyboard_backspace"
                        variant="secondary"
                        onclick="
                            window.location.href = window.location.search
                                ? window.location.search.replace('?from=', '')
                                : '/dashboard'
                        "
                        >Retour</tf-button
                    >
                    <div class="cows-stats">
                        <tf-pill icon="heart_broken"
                            >Malade : <span id="sick-count"></span
                        ></tf-pill>
                        <tf-pill icon="heart_broken"
                            >Sale : <span id="dirty-count"></span
                        ></tf-pill>
                        <span
                            ><span class="material-symbols-rounded">pets</span>
                            <span id="cow-count"></span>
                        </span>
                        <span
                            ><span class="material-symbols-rounded"
                                >water_full</span
                            >
                            <span id="milk-count"></span>
                        </span>
                        <tf-button icon="sell" variant="secondary"
                            >Vendre</tf-button
                        >
                        <div class="actions-wrapper">
                            <button
                                class="menu-actions"
                                onclick="toggleActionsMenu()"
                            >
                                ...
                            </button>
                            <div class="actions-menu" id="actions-menu">
                                <button
                                    onclick="feedAll()"
                                    class="action-button"
                                    id="feed-btn"
                                >
                                    Nourrir
                                </button>
                                <button
                                    onclick="waterAll()"
                                    class="action-button"
                                    id="water-btn"
                                >
                                    Abreuver
                                </button>
                                <button
                                    onclick="healAll()"
                                    class="action-button"
                                    id="heal-btn"
                                >
                                    Soigner
                                </button>
                                <button
                                    onclick="cleanAll()"
                                    class="action-button"
                                    id="clean-btn"
                                >
                                    Nettoyer
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <h1 class="page-title">Pré</h1>

                <div class="game-grid" id="game-grid"></div>
            </main>
            <tf-bottom-actions size="small"></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
