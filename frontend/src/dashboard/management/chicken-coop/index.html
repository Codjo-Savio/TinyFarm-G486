<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Poulailler - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />
        <!-- Config -->
        <script src="/config.js"></script>
        <!-- Components -->
        <script src="/components/tf-app-bar.js"></script>
        <script src="/components/tf-bottom-actions.js"></script>
        <script src="/components/tf-layout.js"></script>
        <script src="/components/tf-pill.js"></script>
        <!-- Theme -->
        <link rel="stylesheet" href="/styles/theme.css" />
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <!-- Custom page style and script -->
        <link rel="stylesheet" href="style.css" />
        <script src="script.js"></script>
    </head>

    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>
            <main>
                <div class="taskbar">
                    <div class="taskbar-left">
                        <a href="/dashboard">
                            <span class="material-symbols-rounded">arrow_back</span>
                            Retour
                        </a>
                    </div>
                    <div class="taskbar-right">
                        <div>
                            <span class="material-symbols-rounded">pets</span>
                            <p id="chicken-count">--</p>
                        </div>
                        <tf-pill icon="heart_broken">
                            Malade : <span id="sick-percent">--%</span>
                        </tf-pill>
                        <tf-pill icon="heart_broken">
                            Sale : <span id="dirty-percent">--%</span>
                        </tf-pill>
                        <div>
                            <span class="material-symbols-rounded">egg</span>
                            <p id="egg-count">--</p>
                        </div>
                        <button class="sell-button">
                            <span class="material-symbols-rounded">sell</span>
                            Vendre
                        </button>
                        <div class="dropdown">
                            <button id="more-actions-btn" class="more-actions-button">
                                <span class="material-symbols-rounded">more_horiz</span>
                            </button>
                            <div id="more-actions-content" class="dropdown-content">
                                <button id="feed-all-btn">Nourrir tout</button>
                                <button id="water-all-btn">Abreuver tout</button>
                                <button id="heal-all-btn">Soigner tout</button>
                                <button id="clean-all-btn">Nettoyer tout</button>
                            </div>
                        </div>
                    </div>
                </div>

                <section>
                    <h1>Poulailler</h1>
                    <div id="chicken-grid" class="grid-container">
                        <!-- Les poules seront injectées ici par script.js -->
                    </div>
                </section>
            </main>
            <tf-bottom-actions size="small"></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
