<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Poulailler - TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />

        <script src="/config.js"></script>
        <script type="module" src="/components/tf-app-bar.js"></script>
        <script type="module" src="/components/tf-bottom-actions.js"></script>
        <script type="module" src="/components/tf-layout.js"></script>

        <link rel="stylesheet" href="/utils/theme.css" />
        <link rel="stylesheet" href="/styles/global.css" />
        <link rel="stylesheet" href="style.css" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />

        <script src="script.js" defer></script>
    </head>

    <body>
        <tf-layout>
            <tf-app-bar></tf-app-bar>

            <main>
                <div class="taskbar">
                    <div class="taskbar-left">
                        <a
                            style="cursor: pointer"
                            onclick="
                                window.location.href = window.location.search
                                    ? window.location.search.replace(
                                          '?from=',
                                          '',
                                      )
                                    : '/dashboard'
                            "
                        >
                            <span class="material-symbols-rounded">
                                arrow_back
                            </span>
                            Retour
                        </a>
                    </div>

                    <div class="taskbar-right">
                        <div>
                            <span class="material-symbols-rounded">pets</span>
                            <p id="chicken-count">0</p>
                        </div>

                        <div>
                            <span class="material-symbols-rounded">egg</span>
                            <p id="egg-count">0</p>
                        </div>

                        <button class="sell-button">
                            <span class="material-symbols-rounded">sell</span>
                            Vendre
                        </button>
                    </div>
                </div>

                <section>
                    <h1>Poulailler</h1>
                    <p id="chicken-status" class="chicken-status"></p>
                    <div class="grid-container"></div>
                </section>
            </main>

            <tf-bottom-actions size="small"></tf-bottom-actions>
        </tf-layout>
    </body>
</html>
