<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard</title>

        <!-- Components -->
        <script src="/components/appbar.js"></script>
        <script src="/components/bottom-actions.js"></script>
        <script src="/components/layout.js"></script>

        <!-- Theme + global -->
        <link rel="stylesheet" href="/styles/theme.css" />
        <link rel="stylesheet" href="/styles/global.css" />

        <!-- Page CSS (CHEMIN CORRIGÉ) -->
        <link
            rel="stylesheet"
            href="/dashboard/management/chicken-coop/style.css"
        />

        <!-- Icons (IMPORTANT) -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />

        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />

        <!-- Script (defer IMPORTANT) -->
        <script src="script.js" defer></script>
    </head>

    <body>
        <app-layout>
            <app-bar></app-bar>

            <main>
                <!-- barre du haut -->
                <div class="taskbar">
                    <div class="taskbar-left">
                        <a
                            style="cursor: pointer"
                            onclick="window.location.href = window.location.search ? window.location.search.replace('?from=', '') : '/dashboard'"
                        >
                            <span class="material-symbols-rounded"
                                >arrow_back</span
                            >
                            Retour
                        </a>
                    </div>

                    <div class="taskbar-right">
                        <div>
                            <span class="material-symbols-rounded">pets</span>
                            <p id="chicken-count">0</p>
                        </div>

                        <div>
                            <span class="material-symbols-rounded">egg</span>
                            <p id="egg-count">0</p>
                        </div>

                        <button class="sell-button">
                            <span class="material-symbols-rounded">sell</span>
                            Vendre
                        </button>
                    </div>
                </div>

                <!-- contenu -->
                <section>
                    <h1>Poulailler</h1>

                    <!-- injecté par JS -->
                    <div class="grid-container"></div>
                </section>
            </main>

            <bottom-actions></bottom-actions>
        </app-layout>
    </body>
</html>
