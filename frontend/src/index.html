<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TinyFarm</title>
        <link rel="icon" href="/assets/logo-128-rounded.png" />
        <!-- Config -->
        <script src="/config.js"></script>
        <!-- Components -->
        <script src="/components/tf-button.js"></script>
        <script src="/components/tf-pill.js"></script>
        <!-- Theme -->
        <link rel="stylesheet" href="/utils/theme.css" />
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <!-- Custom page style and script -->
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <script src="/utils/fetch.js"></script>
    </head>

    <body>
        <div class="parent">
            <div class="div1">
                <div class="rankingTableContainer">
                    <h2 class="rankingTableTitle">Classement des joueurs</h2>
                    <div class="rankingTable">
                        <table
                            class="rankingTableContent is-loading"
                            aria-busy="true"
                        >
                            <tr>
                                <th>
                                    <button
                                        class="rankingButton"
                                        id="rangButton"
                                        active="active"
                                        onclick="
                                            sortTable(
                                                'rang',
                                                document
                                                    .getElementById(
                                                        'rangButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        Rang<span
                                            class="material-symbols-rounded"
                                            >arrow_upward_alt</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    <button
                                        class="rankingButton"
                                        id="nomButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'nom',
                                                document
                                                    .getElementById('nomButton')
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        Nom<span
                                            class="material-symbols-rounded"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    <button
                                        class="rankingButton"
                                        id="productionButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'production',
                                                document
                                                    .getElementById(
                                                        'productionButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        Production<span
                                            class="material-symbols-rounded"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    <button
                                        class="rankingButton"
                                        id="capaciteButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'capacite',
                                                document
                                                    .getElementById(
                                                        'capaciteButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        Capacité<span
                                            class="material-symbols-rounded"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    <button
                                        class="rankingButton"
                                        id="ecusButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'ecus',
                                                document
                                                    .getElementById(
                                                        'ecusButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        Écus<span
                                            class="material-symbols-rounded"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                            </tr>
                            <tr>
                                <td class="left" id="0-0"></td>
                                <td class="inner" id="0-1"></td>
                                <td class="inner" id="0-2"></td>
                                <td class="inner" id="0-3"></td>
                                <td class="right" id="0-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="1-0"></td>
                                <td class="inner" id="1-1"></td>
                                <td class="inner" id="1-2"></td>
                                <td class="inner" id="1-3"></td>
                                <td class="right" id="1-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="2-0"></td>
                                <td class="inner" id="2-1"></td>
                                <td class="inner" id="2-2"></td>
                                <td class="inner" id="2-3"></td>
                                <td class="right" id="2-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="3-0"></td>
                                <td class="inner" id="3-1"></td>
                                <td class="inner" id="3-2"></td>
                                <td class="inner" id="3-3"></td>
                                <td class="right" id="3-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="4-0"></td>
                                <td class="inner" id="4-1"></td>
                                <td class="inner" id="4-2"></td>
                                <td class="inner" id="4-3"></td>
                                <td class="right" id="4-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="5-0"></td>
                                <td class="inner" id="5-1"></td>
                                <td class="inner" id="5-2"></td>
                                <td class="inner" id="5-3"></td>
                                <td class="right" id="5-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="6-0"></td>
                                <td class="inner" id="6-1"></td>
                                <td class="inner" id="6-2"></td>
                                <td class="inner" id="6-3"></td>
                                <td class="right" id="6-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="7-0"></td>
                                <td class="inner" id="7-1"></td>
                                <td class="inner" id="7-2"></td>
                                <td class="inner" id="7-3"></td>
                                <td class="right" id="7-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="8-0"></td>
                                <td class="inner" id="8-1"></td>
                                <td class="inner" id="8-2"></td>
                                <td class="inner" id="8-3"></td>
                                <td class="right" id="8-4"></td>
                            </tr>
                            <tr>
                                <td class="bottomLeft" id="9-0"></td>
                                <td class="bottom" id="9-1"></td>
                                <td class="bottom" id="9-2"></td>
                                <td class="bottom" id="9-3"></td>
                                <td class="bottomRight" id="9-4"></td>
                            </tr>
                        </table>
                    </div>
                </div>
                <div class="button-group">
                    <a id="release" target="_blank">
                        <tf-pill icon="commit"></tf-pill>
                    </a>
                    <a href="/doc/about">À propos </a>
                    <a href="/doc/rules">Règles du jeu </a>
                </div>
            </div>

            <div class="div2">
                <h1 class="welcome-text">
                    Bienvenue sur <br /><span>TinyFarm</span>
                </h1>
                <div class="img-container">
                    <img
                        src="/assets/teteVache.svg"
                        alt="TinyFarm Cow"
                        class="cow-img"
                    />
                </div>
                <tf-button
                    id="github"
                    onclick="auth()"
                    size="large"
                    variant="secondary"
                    >Connexion avec Github</tf-button
                >
            </div>
        </div>
    </body>
</html>
