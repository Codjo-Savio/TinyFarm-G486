<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TinyFarm</title>
        <link
            rel="stylesheet"
            href="style.css"
            href="styles/global.css"
            href="styles/theme.css"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="parent">
            <div class="div1">
                <div class="rankingTableContainer">
                    <h2 class="rankingTableTitle">Classement des joueurs</h2>
                    <div class="rankingTable">
                        <table
                            class="rankingTableContent is-loading"
                            aria-busy="true"
                        >
                            <tr>
                                <th>
                                    Rang
                                    <button
                                        class="rankingButton"
                                        id="rangButton"
                                        active="active"
                                        onclick="
                                            sortTable(
                                                'rang',
                                                document
                                                    .getElementById(
                                                        'rangButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        <span class="material-symbols-outlined"
                                            >arrow_upward_alt</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    Nom
                                    <button
                                        class="rankingButton"
                                        id="nomButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'nom',
                                                document
                                                    .getElementById('nomButton')
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        <span class="material-symbols-outlined"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    Production
                                    <button
                                        class="rankingButton"
                                        id="productionButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'production',
                                                document
                                                    .getElementById(
                                                        'productionButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        <span class="material-symbols-outlined"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    Capacité
                                    <button
                                        class="rankingButton"
                                        id="capaciteButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'capacite',
                                                document
                                                    .getElementById(
                                                        'capaciteButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        <span class="material-symbols-outlined"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                                <th>
                                    Écus
                                    <button
                                        class="rankingButton"
                                        id="ecusButton"
                                        active="false"
                                        onclick="
                                            sortTable(
                                                'ecus',
                                                document
                                                    .getElementById(
                                                        'ecusButton',
                                                    )
                                                    .innerHTML.includes(
                                                        'arrow_upward_alt',
                                                    )
                                                    ? 1
                                                    : -1,
                                            )
                                        "
                                    >
                                        <span class="material-symbols-outlined"
                                            >unfold_more</span
                                        >
                                    </button>
                                </th>
                            </tr>
                            <tr>
                                <td class="left" id="0-0"></td>
                                <td class="inner" id="0-1"></td>
                                <td class="inner" id="0-2"></td>
                                <td class="inner" id="0-3"></td>
                                <td class="right" id="0-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="1-0"></td>
                                <td class="inner" id="1-1"></td>
                                <td class="inner" id="1-2"></td>
                                <td class="inner" id="1-3"></td>
                                <td class="right" id="1-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="2-0"></td>
                                <td class="inner" id="2-1"></td>
                                <td class="inner" id="2-2"></td>
                                <td class="inner" id="2-3"></td>
                                <td class="right" id="2-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="3-0"></td>
                                <td class="inner" id="3-1"></td>
                                <td class="inner" id="3-2"></td>
                                <td class="inner" id="3-3"></td>
                                <td class="right" id="3-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="4-0"></td>
                                <td class="inner" id="4-1"></td>
                                <td class="inner" id="4-2"></td>
                                <td class="inner" id="4-3"></td>
                                <td class="right" id="4-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="5-0"></td>
                                <td class="inner" id="5-1"></td>
                                <td class="inner" id="5-2"></td>
                                <td class="inner" id="5-3"></td>
                                <td class="right" id="5-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="6-0"></td>
                                <td class="inner" id="6-1"></td>
                                <td class="inner" id="6-2"></td>
                                <td class="inner" id="6-3"></td>
                                <td class="right" id="6-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="7-0"></td>
                                <td class="inner" id="7-1"></td>
                                <td class="inner" id="7-2"></td>
                                <td class="inner" id="7-3"></td>
                                <td class="right" id="7-4"></td>
                            </tr>
                            <tr>
                                <td class="left" id="8-0"></td>
                                <td class="inner" id="8-1"></td>
                                <td class="inner" id="8-2"></td>
                                <td class="inner" id="8-3"></td>
                                <td class="right" id="8-4"></td>
                            </tr>
                            <tr>
                                <td class="bottomLeft" id="9-0"></td>
                                <td class="bottom" id="9-1"></td>
                                <td class="bottom" id="9-2"></td>
                                <td class="bottom" id="9-3"></td>
                                <td class="bottomRight" id="9-4"></td>
                            </tr>
                        </table>
                    </div>
                </div>
                <div class="button-group">
                    <a href="/doc/about/index.html">
                        <button id="about">À propos</button>
                    </a>
                    <a href="/doc/rules/index.html">
                        <button id="rules">Règles du jeu</button>
                    </a>
                </div>
            </div>

            <div class="div2">
                <h1 class="welcome-text">
                    Bienvenue sur <br /><span>Tiny Farm</span>
                </h1>
                <div class="img-container">
                    <img
                        src="/assets/teteVache.svg"
                        alt="TinyFarm Cow"
                        class="cow-img"
                    />
                </div>
                <a href="/dashboard/management/chicken-coop/index.html">
                    <button id="github">Connexion avec Github</button>
                </a>
            </div>
        </div>
    </body>
</html>
