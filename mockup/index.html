    <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
    <div class="div1">
        <div class="rankingTableContainer">
            <h2 class="rankingTableTitle">Classement des joueurs</h2>
            <div class="rankingTable">
                <table class="rankingTableContent">
                        <tr>
                            <th>Rang</th>
                            <th>Nom</th>
                            <th>Production</th>
                            <th>Capacité</th>
                            <th>Écus</th>
                        </tr>
                        <tr>
                            <td class="left" id="0-0">1</td>
                            <td class="inner" id="0-1">Pascal</td>
                            <td class="inner" id="0-2">100</td>
                            <td class="inner" id="0-3">200</td>
                            <td class="right" id="0-4">1000</td>
                        </tr>
                        <tr>
                            <td class="left" id="1-0">2</td>
                            <td class="inner" id="1-1">Hala</td>
                            <td class="inner" id="1-2">90</td>
                            <td class="inner" id="1-3">180</td>
                            <td class="right" id="1-4">900</td>
                        </tr>
                        <tr>
                            <td class="left" id="2-0">3</td>
                            <td class="inner" id="2-1">Marie</td>
                            <td class="inner" id="2-2">80</td>
                            <td class="inner" id="2-3">160</td>
                            <td class="right" id="2-4">800</td>
                        </tr>
                        <tr>
                            <td class="left" id="3-0">4</td>
                            <td class="inner" id="3-1">John</td>
                            <td class="inner" id="3-2">70</td>
                            <td class="inner" id="3-3">140</td>
                            <td class="right" id="3-4">700</td>
                        </tr>
                        <tr>
                            <td class="left" id="4-0">5</td>
                            <td class="inner" id="4-1">Alice</td>
                            <td class="inner" id="4-2">60</td>
                            <td class="inner" id="4-3">120</td>
                            <td class="right" id="4-4">600</td>
                        </tr>
                        <tr>
                            <td class="left" id="5-0">6</td>
                            <td class="inner" id="5-1">Bob</td>
                            <td class="inner" id="5-2">50</td>
                            <td class="inner" id="5-3">100</td>
                            <td class="right" id="5-4">500</td>
                        </tr>
                        <tr>
                            <td class="left" id="6-0">7</td>
                            <td class="inner" id="6-1">Charlie</td>
                            <td class="inner" id="6-2">40</td>
                            <td class="inner" id="6-3">80</td>
                            <td class="right" id="6-4">400</td>
                        </tr>
                        <tr>
                            <td class="left" id="7-0">8</td>
                            <td class="inner" id="7-1">Diana</td>
                            <td class="inner" id="7-2">30</td>
                            <td class="inner" id="7-3">60</td>
                            <td class="right" id="7-4">300</td>
                        </tr>
                        <tr>
                            <td class="left" id="8-0">9</td>
                            <td class="inner" id="8-1">Eva</td>
                            <td class="inner" id="8-2">20</td>
                            <td class="inner" id="8-3">40</td>
                            <td class="right" id="8-4">200</td>
                        </tr>
                        <tr>
                            <td class="bottomLeft" id="9-0">10</td>
                            <td class="bottom" id="9-1">Frank</td>
                            <td class="bottom" id="9-2">10</td>
                            <td class="bottom" id="9-3">20</td>
                            <td class="bottomRight" id="9-4">100</td>
                        </tr>
                </table>
            </div>
        </div>
        <div class="button-group">
            <button id="about">À propos</button>
            <button id="rules">Règles du jeu</button>
        </div>
    </div>

    <div class="div2">
        <h1 class="welcome-text">Bienvenue sur <br><span>Tiny Farm</span></h1>
        <img src="../assets/teteVache.svg" alt="TinyFarm Cow" class="cow-img">
        <button id="github">Connexion avec Github</button>
    </div>
</div>
</body>
</html>
