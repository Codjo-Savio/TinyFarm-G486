# Port
server.port=8080

# OAuth2 GitHub
spring.security.oauth2.client.registration.github.client-id={GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret={GITHUB_SECRET}
spring.security.oauth2.client.registration.github.github-pat={GITHUB_PAT}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

jwt.secret={JWT_SECRET}
jwt.expiration-ms={JWT_EXPIRATION_MS}

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
tinyfarm.frontend.url=http://localhost:3000/login/success

spring.application.name=tinyfarm
spring.datasource.url=jdbc:h2:mem:tinyfarmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
