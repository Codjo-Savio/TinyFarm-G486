<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tableau de bord</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Theme -->
    <link rel="stylesheet" href="/styles/theme.css">
    <!-- Global styles -->
    <link rel="stylesheet" href="/styles/global.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- Specific styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="appbar">
        <div class="infos-left">
            <div id="rank">
                <span class="material-symbols-rounded">
                    leaderboard
                </span>
                <span>10/100</span>
            </div>
            <div id="level">
                <span class="material-symbols-rounded">
                    stars
                </span>
                <span>Niveau 2</span>
            </div>
        </div>
        <div class="infos-right">
            <div id="money">
                <span class="material-symbols-rounded">
                    paid
                </span>
                <span>1000</span>
            </div>
            <div id="account" onclick="document.getElementById('account-menu').classList.toggle('open')">
                <span>Pascal</span>
                <img src="/assets/farmer-icon.png" />
            </div>
            <div id="account-menu">
                <a href="/doc/rules?from=/dashboard">
                    <span class="material-symbols-rounded">
                        book
                    </span>
                    <span>Règles du jeu</span>
                </a>
                <a href="#">
                    <span class="material-symbols-rounded">
                        pause_circle
                    </span>
                    <span>Hiberner</span>
                </a>
                <a href="/">
                    <span class="material-symbols-rounded">
                        logout
                    </span>
                    <span>Déconnexion</span>
                </a>
            </div>
        </div>
    </div>
    <main></main>
    <div class="bottom-actions">
        <div class="links">
            <a id="coop" href="/dashboard/trade/cooperative">
                <span class="material-symbols-rounded large">
                    storefront
                </span>
                <div>
                    <span class="label">Coopérative</span>
                    <span class="infos">En stock : 100</span>
                </div>
            </a>
            <a id="marketplace" href="/dashboard/trade/marketplace">
                <span class="material-symbols-rounded large">
                    groups
                </span>
                <div>
                    <span class="label">Marché</span>
                    <span class="infos">En stock : 2</span>
                </div>
            </a>
        </div>
        <div id="time">
            <span class="material-symbols-rounded">
                schedule
            </span>
            <span><b>23:47 AoE</b> • Fin du jour : <b>13 min</b></span>
        </div>
    </div>
</body>

</html>
